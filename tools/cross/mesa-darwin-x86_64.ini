# meson cross file: Mesa (RADV) for macOS x86_64 from Linux, with the toolchain of env.sh (upstream clang/lld and
# MacOSX15.5.sdk). @NX@ and @SDK@ are filled in by tools/cross/build-radv.sh.
[binaries]
c = ['clang', '-target', 'x86_64-apple-macos12.0', '-isysroot', '@SDK@']
cpp = ['clang++', '-target', 'x86_64-apple-macos12.0', '-isysroot', '@SDK@']
objc = ['clang', '-target', 'x86_64-apple-macos12.0', '-isysroot', '@SDK@']
c_ld = 'lld'
cpp_ld = 'lld'
objc_ld = 'lld'
ar = 'llvm-ar'
strip = '@NX@/bin/x86_64-apple-darwin-strip'
install_name_tool = '@NX@/bin/x86_64-apple-darwin-install_name_tool'
pkg-config = 'false'

[built-in options]
# strix1 (the 880M/890M canned device, mesa-patches-phoenix 0007) unless RADV_DARWIN_CANNED says otherwise
c_args = ['-DACD_DEFAULT_CANNED="strix1"']
c_link_args = ['-Wl,-adhoc_codesign']
cpp_link_args = ['-Wl,-adhoc_codesign']

[properties]
needs_exe_wrapper = true

[host_machine]
system = 'darwin'
subsystem = 'macos'
kernel = 'xnu'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
